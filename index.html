<script>
const WEEK = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function nowParts(tz){
  const p = {};
  new Intl.DateTimeFormat('en-US', { timeZone: tz, weekday: 'short', month: 'short',
    day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23'
  }).formatToParts(new Date()).forEach(x => p[x.type] = x.value);
  return p;
}
function marketOpen(tz, open, close){
  const p = nowParts(tz);
  const wd = WEEK.indexOf(p.weekday);
  const m = parseInt(p.hour,10)*60 + parseInt(p.minute,10);
  return wd>=1 && wd<=5 && m>=open && m<close;
}
function pad(n){ return String(n).padStart(2,'0'); }
function setMkt(id, open, label){
  const el = document.getElementById(id);
  el.className = 'mkt ' + (open ? 'open' : 'closed');
  el.textContent = (label ? label + ' ' : '') + (open ? '開盤中' : '未開盤');
}
function tick(){
  const tw = nowParts('Asia/Taipei');
  const ny = nowParts('America/New_York');
  document.getElementById('clk-tw').textContent = pad(tw.hour)+':'+pad(tw.minute)+':'+pad(tw.second);
  document.getElementById('clk-ny').textContent = pad(ny.hour)+':'+pad(ny.minute)+':'+pad(ny.second);
  const twO = marketOpen('Asia/Taipei', 9*60, 13*60+30);
  const nyO = marketOpen('America/New_York', 9*60+30, 16*60);
  setMkt('tw-mkt', twO, '台股'); setMkt('ny-mkt', nyO, '美股');
}
tick(); setInterval(tick, 1000);
</script>
